<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%23b566ff'/><stop offset='50%25' stop-color='%23ff5fb0'/><stop offset='100%25' stop-color='%235ec8ff'/></linearGradient></defs><rect width='32' height='32' rx='7' ry='7' fill='url(%23g)'/></svg>" />
<title>일정 - 분당우리교회 4청년부 이종환 순</title>
<meta name="description" content="분당우리교회 4청년부 이종환 순 일정" />

<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/theme.css" />
<script src="assets/app.js"></script>
<style>
  .cal-cell {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 6px 0 0 8px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 0.75rem;
    color: #f5f1ff;
  }
  .cal-cell.is-outside { color: #4a4459; }
  .cal-cell.is-today {
    background: linear-gradient(180deg, rgba(28,21,48,0.9), rgba(21,16,31,0.7));
    border: 1px solid rgba(181,102,255,0.6);
    box-shadow: 0 0 16px -4px rgba(181,102,255,0.6);
    color: #b566ff;
    font-weight: 700;
  }
  .cal-nav-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 9999px;
    border: 1px solid rgba(140,110,200,0.28);
    color: #f5f1ff;
    transition: all .15s ease;
  }
  .cal-nav-btn:hover { border-color: rgba(181,102,255,0.6); color: #b566ff; }
</style>
</head>
<body class="bg-background text-foreground">

<nav class="sticky top-0 z-40 border-b border-border bg-background/90 backdrop-blur-sm">
  <div class="mx-auto max-w-screen-md px-5">
    <div class="flex items-center justify-between gap-2 py-3">
      <div class="flex items-center gap-2">
        <a href="index.html" class="nav-link">홈</a>
        <a href="notice.html" class="nav-link">공지</a>
        <a href="calendar.html" class="nav-link is-active">일정</a>
      </div>
      <div id="nav-auth" class="flex items-center gap-2"></div>
    </div>
  </div>
</nav>

<section class="relative overflow-hidden">
  <div class="grid-bg absolute inset-0 -z-10"></div>

  <div class="mx-auto max-w-screen-md px-5 pt-10 pb-16 sm:pt-14 sm:pb-20">

    <div class="reveal-item mb-8">
      <div class="mb-3 flex justify-start">
        <span class="inline-flex items-center gap-2 rounded-full border border-border bg-surface/60 px-3 py-1 text-[11px] font-medium tracking-[0.18em] text-neon-purple uppercase">
          <span class="h-1.5 w-1.5 rounded-full bg-neon-purple shadow-[0_0_8px_#b566ff]"></span>
          Schedule
        </span>
      </div>
      <h1 class="text-2xl font-bold leading-tight tracking-tight text-foreground sm:text-3xl md:text-4xl">
        일정
      </h1>
      <p class="mt-3 text-sm leading-relaxed text-muted-foreground sm:text-base">
        이종환 순의 모임 일정이에요.
      </p>
    </div>

    <div class="neon-card reveal-item p-5 sm:p-6">
      <div class="mb-5 flex items-center justify-between">
        <button type="button" id="cal-prev" class="cal-nav-btn" aria-label="이전 달">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div id="cal-title" class="text-lg font-bold tracking-tight text-foreground"></div>
        <button type="button" id="cal-next" class="cal-nav-btn" aria-label="다음 달">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold text-muted-foreground">
        <div class="py-2 text-[#ff5f6d]">일</div>
        <div class="py-2">월</div>
        <div class="py-2">화</div>
        <div class="py-2">수</div>
        <div class="py-2">목</div>
        <div class="py-2">금</div>
        <div class="py-2 text-neon-blue">토</div>
      </div>

      <div id="cal-grid" class="grid grid-cols-7 gap-1"></div>
    </div>

  </div>
</section>

<script>
  var today = getKstToday();
  var viewYear = today.y;
  var viewMonth = today.m; // 0-indexed

  var titleEl = document.getElementById('cal-title');
  var gridEl = document.getElementById('cal-grid');

  function renderCalendar() {
    titleEl.textContent = viewYear + '년 ' + (viewMonth + 1) + '월';
    gridEl.innerHTML = '';

    var firstWeekday = new Date(Date.UTC(viewYear, viewMonth, 1)).getUTCDay();
    var daysInMonth = new Date(Date.UTC(viewYear, viewMonth + 1, 0)).getUTCDate();
    var daysInPrevMonth = new Date(Date.UTC(viewYear, viewMonth, 0)).getUTCDate();

    var totalCells = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;

    for (var i = 0; i < totalCells; i++) {
      var cell = document.createElement('div');
      var dayNum = i - firstWeekday + 1;

      if (dayNum < 1) {
        cell.className = 'cal-cell is-outside';
        cell.textContent = daysInPrevMonth + dayNum;
      } else if (dayNum > daysInMonth) {
        cell.className = 'cal-cell is-outside';
        cell.textContent = dayNum - daysInMonth;
      } else {
        var isToday = viewYear === today.y && viewMonth === today.m && dayNum === today.d;
        cell.className = 'cal-cell' + (isToday ? ' is-today' : '');
        cell.textContent = String(dayNum);
      }

      gridEl.appendChild(cell);
    }
  }

  document.getElementById('cal-prev').addEventListener('click', function () {
    viewMonth -= 1;
    if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
    renderCalendar();
  });

  document.getElementById('cal-next').addEventListener('click', function () {
    viewMonth += 1;
    if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
    renderCalendar();
  });

  renderCalendar();

  var items = document.querySelectorAll('.reveal-item');
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
  items.forEach(function (el) { obs.observe(el); });
</script>

</body>
</html>
