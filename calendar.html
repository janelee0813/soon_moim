<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%23b566ff'/><stop offset='50%25' stop-color='%23ff5fb0'/><stop offset='100%25' stop-color='%235ec8ff'/></linearGradient></defs><rect width='32' height='32' rx='7' ry='7' fill='url(%23g)'/></svg>" />
<title>일정 - 분당우리교회 4청년부 이종환 순</title>
<meta name="description" content="분당우리교회 4청년부 이종환 순 일정" />

<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/theme.css" />
<script src="assets/app.js"></script>
<style>
  .sched-date {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 4.25rem;
    height: 4.25rem;
    flex-shrink: 0;
    border-radius: 1rem;
    border: 1px solid rgba(140,110,200,0.28);
    background: rgba(21,16,31,0.7);
  }
  .sched-date .month { font-size: 11px; font-weight: 600; color: #9b94b3; }
  .sched-date .day { font-size: 22px; font-weight: 700; color: #b566ff; line-height: 1.15; }
  .sched-date.is-tbd {
    border-style: dashed;
    border-color: rgba(140,110,200,0.4);
    background: transparent;
  }
  .sched-date.is-tbd .tbd-label { font-size: 12px; font-weight: 700; color: #9b94b3; }
</style>
</head>
<body class="bg-background text-foreground">

<nav class="sticky top-0 z-40 border-b border-border bg-background/90 backdrop-blur-sm">
  <div class="mx-auto max-w-screen-md px-5">
    <div class="flex items-center justify-between gap-2 py-3">
      <div class="flex items-center gap-2">
        <a href="index.html" class="nav-link">홈</a>
        <a href="notice.html" class="nav-link">공지</a>
        <a href="calendar.html" class="nav-link is-active">일정</a>
      </div>
      <div id="nav-auth" class="flex items-center gap-2"></div>
    </div>
  </div>
</nav>

<section class="relative overflow-hidden">
  <div class="grid-bg absolute inset-0 -z-10"></div>

  <div class="mx-auto max-w-screen-md px-5 pt-10 pb-16 sm:pt-14 sm:pb-20">

    <div class="reveal-item mb-8">
      <div class="mb-3 flex justify-start">
        <span class="inline-flex items-center gap-2 rounded-full border border-border bg-surface/60 px-3 py-1 text-[11px] font-medium tracking-[0.18em] text-neon-purple uppercase">
          <span class="h-1.5 w-1.5 rounded-full bg-neon-purple shadow-[0_0_8px_#b566ff]"></span>
          Schedule
        </span>
      </div>
      <h1 class="text-2xl font-bold leading-tight tracking-tight text-foreground sm:text-3xl md:text-4xl">
        일정
      </h1>
      <p class="mt-3 text-sm leading-relaxed text-muted-foreground sm:text-base">
        이종환 순의 주요 일정이에요.
      </p>
    </div>

    <div class="neon-card reveal-item divide-y divide-border/60 p-5 sm:p-6" id="sched-list"></div>

    <div class="reveal-item mb-3 mt-10">
      <h2 class="text-lg font-bold tracking-tight text-foreground sm:text-xl">다가올 일정</h2>
      <p class="mt-1 text-xs text-muted-foreground sm:text-sm">날짜는 추후 확정되는 대로 안내드릴게요.</p>
    </div>

    <div class="neon-card reveal-item divide-y divide-border/60 p-5 sm:p-6" id="sched-tbd-list"></div>

  </div>
</section>

<script>
  var SCHEDULE = [
    { month: 8, day: 8, weekday: '주일', title: '순별 스페셜데이' },
    { month: 9, day: 27, weekday: '주일', title: '부서모임 스페셜데이 (추석)' },
    { month: 10, day: 25, weekday: '주일', title: '새생명 축제 연계' },
    { month: 11, day: 29, weekday: '주일', title: '마을별 스페셜데이' },
    { month: 12, day: 27, weekday: '주일', title: '하반기 종강 및 마무리' }
  ];

  var UPCOMING = [
    { title: '가을수련회 (원데이 말씀사경회)' },
    { title: '1:1 양육훈련' },
    { title: '하반기 마을훈련' }
  ];

  var listEl = document.getElementById('sched-list');

  listEl.innerHTML = SCHEDULE.map(function (item) {
    return (
      '<div class="flex items-center gap-4 py-4 first:pt-0 last:pb-0">' +
        '<div class="sched-date">' +
          '<span class="month">' + item.month + '월</span>' +
          '<span class="day">' + item.day + '</span>' +
        '</div>' +
        '<div class="min-w-0">' +
          '<div class="text-[11px] font-medium text-muted-foreground">' + item.weekday + '</div>' +
          '<div class="text-base font-semibold leading-snug text-foreground">' + item.title + '</div>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  var tbdListEl = document.getElementById('sched-tbd-list');

  tbdListEl.innerHTML = UPCOMING.map(function (item) {
    return (
      '<div class="flex items-center gap-4 py-4 first:pt-0 last:pb-0">' +
        '<div class="sched-date is-tbd">' +
          '<span class="tbd-label">미정</span>' +
        '</div>' +
        '<div class="min-w-0">' +
          '<div class="text-[11px] font-medium text-muted-foreground">날짜 미정</div>' +
          '<div class="text-base font-semibold leading-snug text-foreground">' + item.title + '</div>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  var items = document.querySelectorAll('.reveal-item');
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
  items.forEach(function (el) { obs.observe(el); });
</script>

</body>
</html>
