name: 오늘의 한 구절 자동 업데이트

on:
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-verse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 한 구절 가져오기
        run: python3 scripts/update_verse.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/verse.json
          git diff --cached --quiet || git commit -m "오늘의 한 구절 자동 업데이트"
          git push
