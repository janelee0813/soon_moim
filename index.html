<title>분당우리교회 4청년부 - 이종환 순</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'Apple SD Gothic Neo', 'Segoe UI', 'Roboto', 'sans-serif']
        },
        colors: {
          background: '#0a0612',
          surface: '#15101f',
          'surface-elevated': '#1c1530',
          foreground: '#f5f1ff',
          muted: '#1a1428',
          'muted-foreground': '#9b94b3',
          border: 'rgba(140,110,200,0.22)',
          'neon-purple': '#b566ff',
          'neon-pink': '#ff5fb0',
          'neon-blue': '#5ec8ff'
        },
        animation: {
          'fade-up': 'fade-up 0.7s cubic-bezier(0.22,1,0.36,1) both',
          'glow-pulse': 'glow-pulse 3s ease-in-out infinite',
          'shimmer': 'shimmer 6s linear infinite'
        },
        keyframes: {
          'fade-up': { '0%': { opacity: 0, transform: 'translateY(24px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
          'glow-pulse': { '0%,100%': { boxShadow: '0 0 20px -8px rgba(181,102,255,0.5)' }, '50%': { boxShadow: '0 0 35px -4px rgba(181,102,255,0.85)' } },
          'shimmer': { '0%': { backgroundPosition: '0% 50%' }, '100%': { backgroundPosition: '200% 50%' } }
        }
      }
    }
  };
</script>

<style>
  html { scroll-behavior: smooth; background: #0a0612; color-scheme: dark; }
  body { background: #0a0612; color: #f5f1ff; font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(181,102,255,0.35); }

  .grid-bg {
    background-image:
      radial-gradient(circle at 20% 0%, rgba(181,102,255,0.18), transparent 45%),
      radial-gradient(circle at 80% 10%, rgba(255,95,176,0.14), transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(94,200,255,0.12), transparent 55%);
  }
  .divider-neon {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(181,102,255,0.6), rgba(255,95,176,0.5), transparent);
  }
  .neon-card {
    position: relative;
    background: linear-gradient(180deg, rgba(28,21,48,0.85), rgba(21,16,31,0.7));
    border: 1px solid rgba(140,110,200,0.28);
    backdrop-filter: blur(8px);
    border-radius: 1rem;
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .neon-card:hover { transform: translateY(-2px); box-shadow: 0 10px 40px -15px rgba(181,102,255,0.5); }

  .text-gradient-neon {
    background: linear-gradient(100deg, #b566ff 0%, #ff5fb0 50%, #5ec8ff 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
  }

  /* 프로필/섹션 스크롤 리빌 효과 */
  .reveal-item {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity .7s cubic-bezier(0.22,1,0.36,1), transform .7s cubic-bezier(0.22,1,0.36,1);
  }
  .reveal-item.revealed { opacity: 1; transform: translateY(0); }

  .avatar-box {
    aspect-ratio: 1 / 1;
    overflow: hidden;
  }
  .avatar-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body class="bg-background text-foreground">

<!-- HERO -->
<section class="relative overflow-hidden">
  <div class="grid-bg absolute inset-0 -z-10"></div>
  <div class="absolute inset-x-0 top-0 -z-10 h-px bg-gradient-to-r from-transparent via-neon-purple/60 to-transparent"></div>

  <div class="mx-auto max-w-screen-md px-5 pt-16 pb-16 sm:pt-20 sm:pb-20">

    <div class="inline-flex items-center gap-2 rounded-full border border-border bg-surface/70 px-3 py-1.5 text-xs font-medium text-muted-foreground backdrop-blur animate-fade-up">
      <svg class="h-3.5 w-3.5 text-neon-pink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span>분당우리교회 4청년부</span>
    </div>

    <h1 class="mt-4 text-left text-5xl font-bold leading-[1.1] tracking-tight sm:text-6xl animate-fade-up" style="animation-delay:60ms">
      <span class="text-gradient-neon">이종환 순</span>
    </h1>

    <div class="mt-8 flex flex-wrap items-center gap-3 animate-fade-up" style="animation-delay:140ms">
      <a id="meditation-btn" href="https://www.woorichurch.org/modu/ov/ov_meditation.asp" target="_blank" rel="noopener" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-neon-purple via-neon-pink to-neon-blue px-6 py-3 text-sm font-semibold text-background shadow-[0_10px_40px_-10px_rgba(181,102,255,0.7)] transition-transform hover:scale-[1.03]">
        한 구절 묵상 바로가기
      </a>
      <a href="#" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-neon-purple via-neon-pink to-neon-blue px-6 py-3 text-sm font-semibold text-background shadow-[0_10px_40px_-10px_rgba(181,102,255,0.7)] transition-transform hover:scale-[1.03]">
        MY PAGE
      </a>
    </div>

    <div class="neon-card animate-glow-pulse mt-6 p-6 animate-fade-up" style="animation-delay:220ms">
      <div id="verse-ref" class="mb-3 text-[11px] font-semibold uppercase tracking-[0.2em] text-neon-purple">
        호세아 8장 13절
      </div>
      <p id="verse-text" class="text-lg leading-relaxed text-foreground/90">
        그들이 내게 고기를 제물로 드리고 먹을지라도 여호와는 그것을 기뻐하지 아니하고 이제 그들의 죄악을 기억하여 그 죄를 벌하리니 그들은 애굽으로 다시 가리라
      </p>
    </div>

  </div>

  <div class="divider-neon mx-auto max-w-screen-md"></div>
</section>

<!-- 순원 소개 -->
<section class="px-5 py-16 sm:py-20">
  <div class="mx-auto max-w-screen-md">

    <div class="reveal-item mb-8">
      <div class="mb-3 flex justify-start">
        <span class="inline-flex items-center gap-2 rounded-full border border-border bg-surface/60 px-3 py-1 text-[11px] font-medium tracking-[0.18em] text-neon-purple uppercase">
          <span class="h-1.5 w-1.5 rounded-full bg-neon-purple shadow-[0_0_8px_#b566ff]"></span>
          Members
        </span>
      </div>
      <h2 class="text-2xl font-bold leading-tight tracking-tight text-foreground sm:text-3xl md:text-4xl">
        순원 소개
      </h2>
      <p class="mt-3 text-sm leading-relaxed text-muted-foreground sm:text-base">
        함께 말씀을 나누는 순원들이에요.
      </p>
    </div>

    <div class="grid grid-cols-2 gap-4 sm:grid-cols-5 sm:gap-5" id="member-grid"></div>

  </div>
</section>

<div class="mx-auto max-w-screen-md px-5 pb-10 text-center text-[11px] text-muted-foreground">
  분당우리교회 4청년부 이종환 순
</div>

<script>
  var members = [
    "김민준", "이서연", "박도현", "최지우", "정하은",
    "강태윤", "윤소율", "임현우", "한지민", "오세훈"
  ];

  var grid = document.getElementById('member-grid');
  members.forEach(function (name, i) {
    var wrap = document.createElement('div');
    wrap.className = 'reveal-item flex flex-col items-center gap-3';
    wrap.dataset.delay = String(i * 80);

    wrap.innerHTML =
      '<div class="neon-card avatar-box w-full rounded-2xl">' +
        '<img src="https://api.dicebear.com/7.x/adventurer/svg?seed=' + encodeURIComponent(name + i) + '&backgroundColor=1c1530,15101f,1a1428" alt="' + name + '" loading="lazy" />' +
      '</div>' +
      '<span class="text-sm font-medium text-foreground/90">' + name + '</span>';

    grid.appendChild(wrap);
  });

  // 스크롤 진입 시 reveal
  var items = document.querySelectorAll('.reveal-item');
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        var el = entry.target;
        var delay = Number(el.dataset.delay || 0);
        setTimeout(function () { el.classList.add('revealed'); }, delay);
        obs.unobserve(el);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

  items.forEach(function (el) { obs.observe(el); });

  // 한국 표준시(KST, UTC+9) 기준 오늘 날짜 문자열(YYYY-MM-DD)과
  // 다음 00:00까지 남은 시간을 계산
  var KST_OFFSET_MS = 9 * 60 * 60 * 1000;

  function pad2(n) { return String(n).padStart(2, '0'); }

  function getKstDateString(nowMs) {
    var kst = new Date(nowMs + KST_OFFSET_MS);
    return kst.getUTCFullYear() + '-' + pad2(kst.getUTCMonth() + 1) + '-' + pad2(kst.getUTCDate());
  }

  function msUntilNextKstMidnight(nowMs) {
    var kst = new Date(nowMs + KST_OFFSET_MS);
    var nextMidnightKst = Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate() + 1, 0, 0, 0) - KST_OFFSET_MS;
    return nextMidnightKst - nowMs;
  }

  function updateMeditationLink() {
    var todayStr = getKstDateString(Date.now());
    var link = document.getElementById('meditation-btn');
    link.href = 'https://www.woorichurch.org/modu/ov/ov_meditation.asp?ov_date=' + todayStr;
  }

  function loadTodayVerse() {
    fetch('data/verse.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('load fail'); return res.json(); })
      .then(function (data) {
        document.getElementById('verse-ref').textContent = data.reference;
        document.getElementById('verse-text').textContent = data.text;
      })
      .catch(function () {
        // data/verse.json을 불러오지 못하면 페이지에 저장된 마지막 값을 그대로 둠
      });
  }

  function scheduleMidnightRefresh() {
    var delay = msUntilNextKstMidnight(Date.now()) + 2000; // 자정 넘어가는 순간을 확실히 지나도록 여유를 둠
    setTimeout(function () {
      updateMeditationLink();
      loadTodayVerse();
      scheduleMidnightRefresh();
    }, delay);
  }

  updateMeditationLink();
  loadTodayVerse();
  scheduleMidnightRefresh();
</script>

</body>
</html>
