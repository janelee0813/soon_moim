<!-- 순원 소개 -->
<section class="px-5 py-16 sm:py-20">
  <div class="mx-auto max-w-screen-md">

    <div class="reveal-item mb-8">
      <div class="mb-3 flex justify-start">
        <span class="inline-flex items-center gap-2 rounded-full border border-border bg-surface/60 px-3 py-1 text-[11px] font-medium tracking-[0.18em] text-neon-purple uppercase">
          <span class="h-1.5 w-1.5 rounded-full bg-neon-purple shadow-[0_0_8px_#b566ff]"></span>
          Members
        </span>
      </div>
      <h2 class="text-2xl font-bold leading-tight tracking-tight text-foreground sm:text-3xl md:text-4xl">
        순원 소개
      </h2>
      <p class="mt-3 text-sm leading-relaxed text-muted-foreground sm:text-base">
        함께 말씀을 나누는 순원들이에요.
      </p>
    </div>

    <div class="grid grid-cols-2 gap-4 sm:grid-cols-5 sm:gap-5" id="member-grid"></div>

  </div>
</section>

<div class="mx-auto max-w-screen-md px-5 pb-10 text-center text-[11px] text-muted-foreground">
  분당우리교회 4청년부 이종환 순
</div>

<script>
  var members = [
    { name: "이종환", avatar: "assets/members/leader.png" },
    { name: "권은주", gender: "F" },
    { name: "김경민", gender: "F" },
    { name: "김민지", gender: "F" },
    { name: "김상미", gender: "F" },
    { name: "김원태", gender: "M" },
    { name: "윤주혜", gender: "F" },
    { name: "이은빈", gender: "F" },
    { name: "홍영민", gender: "F" },
    { name: "이수정", gender: "F" },
    { name: "이화진", gender: "F" },
    { name: "김효진", gender: "F" }
  ];

  var AVATAR_BG = 'f9e7cb';
  var FEMALE_HAIR = ['long', 'bobCut', 'curly', 'pigtails', 'curlyBun', 'bobBangs', 'straightBun', 'extraLong', 'curlyHighTop'];
  var MALE_HAIR = ['shortCombover', 'buzzcut', 'fade', 'cap', 'beanie', 'sideShave', 'shortComboverChops', 'balding'];

  function personaAvatarUrl(seed, gender) {
    var hairSet = gender === 'M' ? MALE_HAIR : FEMALE_HAIR;
    var facialHairProbability = gender === 'M' ? 25 : 0;
    var params = 'seed=' + encodeURIComponent(seed) +
      '&backgroundColor=' + AVATAR_BG +
      '&facialHairProbability=' + facialHairProbability;
    hairSet.forEach(function (h) { params += '&hair=' + h; });
    return 'https://api.dicebear.com/7.x/personas/svg?' + params;
  }

  // 아바타는 항상 같은 이미지가 나오도록, 순서와 무관한 고정 시드를 미리 부여
  members.forEach(function (member, i) { member.seedKey = member.name + i; });

  var grid = document.getElementById('member-grid');

  function buildMemberCard(member, i, skipFadeIn) {
    var wrap = document.createElement('div');
    wrap.className = 'reveal-item flex flex-col items-center gap-3' + (skipFadeIn ? ' revealed' : '');
    wrap.dataset.delay = String(i * 80);
    wrap.dataset.name = member.name;

    var avatarSrc = member.avatar
      ? member.avatar
      : personaAvatarUrl(member.seedKey, member.gender);

    wrap.innerHTML =
      '<div class="neon-card avatar-box w-full rounded-2xl">' +
        '<img src="' + avatarSrc + '" alt="' + member.name + '" loading="lazy" />' +
      '</div>' +
      '<span class="text-sm font-medium text-foreground/90">' + member.name + '</span>';

    return wrap;
  }

  function renderMembers(skipFadeIn) {
    grid.innerHTML = '';
    members.forEach(function (member, i) {
      grid.appendChild(buildMemberCard(member, i, skipFadeIn));
    });
  }

  renderMembers(false);

  // 스크롤 진입 시 reveal
  var items = document.querySelectorAll('.reveal-item');
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        var el = entry.target;
        var delay = Number(el.dataset.delay || 0);
        setTimeout(function () { el.classList.add('revealed'); }, delay);
        obs.unobserve(el);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

  items.forEach(function (el) { obs.observe(el); });

  // 30초마다 순원 카드 순서를 랜덤으로 섞고, 자리를 부드럽게 바꾸는 애니메이션(FLIP)
  function shuffleArray(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
  }

  function shuffleMembersWithFlip() {
    var oldRects = {};
    Array.prototype.forEach.call(grid.children, function (child) {
      oldRects[child.dataset.name] = child.getBoundingClientRect();
    });

    shuffleArray(members);
    renderMembers(true);

    var SHUFFLE_DURATION_MS = 1800;
    var STAGGER_STEP_MS = 90;

    Array.prototype.forEach.call(grid.children, function (child, i) {
      var oldRect = oldRects[child.dataset.name];
      if (!oldRect) return;
      var newRect = child.getBoundingClientRect();
      var dx = oldRect.left - newRect.left;
      var dy = oldRect.top - newRect.top;
      if (!dx && !dy) return;

      var wobble = (Math.random() * 10 - 5).toFixed(1);
      var delay = i * STAGGER_STEP_MS;
      child.style.transition = 'none';
      child.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.1) rotate(' + wobble + 'deg)';
      child.style.zIndex = '1';

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          child.style.transition = 'transform ' + SHUFFLE_DURATION_MS + 'ms cubic-bezier(0.34,1.56,0.64,1) ' + delay + 'ms';
          child.style.transform = '';
          setTimeout(function () { child.style.zIndex = ''; }, SHUFFLE_DURATION_MS + delay);
        });
      });
    });
  }

  // 순원 카드가 스크롤로 처음 보이는 시점에 한 번 셔플하고, 이후 20초마다 반복
  var shuffleStarted = false;
  var shuffleStartObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting && !shuffleStarted) {
        shuffleStarted = true;
        setTimeout(function () {
          shuffleMembersWithFlip();
          setInterval(shuffleMembersWithFlip, 20000);
        }, 700); // 카드 페이드인이 끝난 뒤 자연스럽게 이어지도록 약간의 지연
        shuffleStartObs.disconnect();
      }
    });
  }, { threshold: 0.2 });
  shuffleStartObs.observe(grid);

  // 한국 표준시(KST, UTC+9) 기준 오늘 날짜 문자열(YYYY-MM-DD)과
  // 다음 00:00까지 남은 시간을 계산
  var KST_OFFSET_MS = 9 * 60 * 60 * 1000;

  function pad2(n) { return String(n).padStart(2, '0'); }

  function getKstDateString(nowMs) {
    var kst = new Date(nowMs + KST_OFFSET_MS);
    return kst.getUTCFullYear() + '-' + pad2(kst.getUTCMonth() + 1) + '-' + pad2(kst.getUTCDate());
  }

  function msUntilNextKstMidnight(nowMs) {
    var kst = new Date(nowMs + KST_OFFSET_MS);
    var nextMidnightKst = Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate() + 1, 0, 0, 0) - KST_OFFSET_MS;
    return nextMidnightKst - nowMs;
  }

  function updateMeditationLink() {
    var todayStr = getKstDateString(Date.now());
    var link = document.getElementById('meditation-btn');
    link.href = 'https://www.woorichurch.org/modu/ov/ov_meditation.asp?ov_date=' + todayStr;
  }

  var WEEKDAYS_KO = ['일', '월', '화', '수', '목', '금', '토'];

  function formatVerseDate(dateStr) {
    // dateStr: 'YYYY-MM-DD' (KST 기준 날짜). UTC 자정으로 파싱해 타임존 영향 없이 그대로 표시
    var d = new Date(dateStr + 'T00:00:00Z');
    var y = d.getUTCFullYear();
    var m = pad2(d.getUTCMonth() + 1);
    var day = pad2(d.getUTCDate());
    var weekday = WEEKDAYS_KO[d.getUTCDay()];
    return y + '.' + m + '.' + day + '(' + weekday + ')';
  }

  function loadTodayVerse() {
    fetch('data/verse.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('load fail'); return res.json(); })
      .then(function (data) {
        document.getElementById('verse-ref').textContent = data.reference;
        document.getElementById('verse-text').textContent = data.text;
        document.getElementById('verse-date').textContent = formatVerseDate(data.date);
      })
      .catch(function () {
        // data/verse.json을 불러오지 못하면 페이지에 저장된 마지막 값을 그대로 둠
      });
  }

  function scheduleMidnightRefresh() {
    var delay = msUntilNextKstMidnight(Date.now()) + 2000; // 자정 넘어가는 순간을 확실히 지나도록 여유를 둠
    setTimeout(function () {
      updateMeditationLink();
      loadTodayVerse();
      scheduleMidnightRefresh();
    }, delay);
  }

  updateMeditationLink();
  loadTodayVerse();
  scheduleMidnightRefresh();
</script>
